services:
  - type: web
    name: magnet-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    domains:
      - api.insmittech.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://magnet.insmittech.com
      - key: MONGODB_URI
        sync: false # Set this in the Render dashboard (e.g. MongoDB Atlas Connection String)
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure JWT secret
